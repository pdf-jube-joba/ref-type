[workspace]
resolver = "2"
members = [
    "src/kernel",
    "src/front",
    "src/syntax",
    "src/elaboration",
    "src/cli",
]

[workspace.dependencies]
rustc-hash = "2.1.1"

[profile.release]
debug = true

# Elaboration is allocation- and recursion-heavy enough that unoptimized code
# makes normal `cargo run` iterations unnecessarily slow. Debug information and
# debug assertions remain enabled.
[profile.dev]
opt-level = 2
