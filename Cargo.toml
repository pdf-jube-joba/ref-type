[workspace]
resolver = "2"
members = [
    "src/artifact",
    "src/artifact-derive",
    "src/timing",
    "src/diagnostics",
    "src/kernel",
    "src/sema",
    "src/syntax",
    "src/resolve",
    "src/project",
    "src/elaboration",
    "src/cli",
    "benchmarks",
]
default-members = ["src/*"]

[workspace.dependencies]
artifact = { path = "src/artifact" }
artifact-derive = { path = "src/artifact-derive" }
diagnostics = { path = "src/diagnostics" }
elaboration = { path = "src/elaboration" }
kernel = { path = "src/kernel" }
miniz_oxide = "0.8.9"
project = { path = "src/project" }
resolve = { path = "src/resolve" }
sema = { path = "src/sema" }
syntax = { path = "src/syntax" }
timing = { path = "src/timing" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
quote = "1"
rustc-hash = "2.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "3.0.6", features = ["full"] }
tracing = "0.1"
zstd = { version = "0.13.3", default-features = false }

[profile.release]
debug = true
lto = "thin"

# Elaboration is allocation- and recursion-heavy enough that unoptimized code
# makes normal `cargo run` iterations unnecessarily slow. Debug information and
# debug assertions remain enabled.
[profile.dev]
opt-level = 2
