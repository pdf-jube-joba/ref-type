[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[features]
# Exposes arena checkpoint operations used only to keep benchmark iterations
# from retaining their temporary nodes.
bench-internals = []

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
tracing = "0.1"

[[bench]]
name = "phases"
harness = false
required-features = ["bench-internals"]
