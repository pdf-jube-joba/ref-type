[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
kernel = { path = "../kernel" }
front = { path = "../front" }
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5.51", features = ["derive"] }
anyhow = "1.0.100"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tree = "0.4"
