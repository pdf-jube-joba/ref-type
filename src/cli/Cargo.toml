[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[features]
system-allocator = []
large-allocation-profile = []
small-allocation-profile = []

[dependencies]
sema = { path = "../sema" }
clap = { version = "4.5.51", features = ["derive"] }
anyhow = "1.0.100"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tree = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
mimalloc = "0.1.52"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
