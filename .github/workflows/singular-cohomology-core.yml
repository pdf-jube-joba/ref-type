name: Singular cohomology core and excision
on:
  push:
    branches: [feat/singular-cohomology]
    paths:
      - '.github/workflows/singular-cohomology-core.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: singular-cohomology-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.ci/rustup
      CARGO_BUILD_JOBS: 3
      REF_TYPE_CACHE: ${{ github.workspace }}/.ci/refcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci/cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Identify Rust toolchain
        id: rust-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: checker-cache
        with:
          path: build/ref-type
          key: checker-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs', 'src/**/Cargo.toml') }}
      - name: Build checker
        if: steps.checker-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked -p cli
          mkdir -p build
          cp target/debug/cli build/ref-type
          strip --strip-debug build/ref-type
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: ${{ github.workspace }}/.ci/refcache
          key: proof-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-${{ hashFiles('libs/**/*.ref', 'libs/**/ref.toml') }}
          restore-keys: proof-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-
      - name: Check the singular chain complex
        run: >-
          build/ref-type libs/topology/singular_cohomology
          --module singular_cohomology.Chains --module-only
          --memory-mib 8192 --batch-seconds 900
          --cache-dir "$REF_TYPE_CACHE" --cache-budget-mib 2048
          --diagnostics compact
      - uses: actions/cache/save@v4
        if: steps.proof-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ci/refcache
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: checker
          path: build/ref-type
          retention-days: 1
  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - name: simplex-degeneracy-composition
            package: algebraic_topology
            module: algebraic_topology.Simplex.Degeneracy.Composition
            scope: declarations
          - name: simplex-degeneracy-mixed
            package: algebraic_topology
            module: algebraic_topology.Simplex.Degeneracy.Mixed
            scope: declarations
          - name: simplex-boundary
            package: algebraic_topology
            module: algebraic_topology.Simplex.Boundary
            scope: subtree
          - name: compact-uniform-continuity
            package: metric_spaces
            module: metric_spaces.MetricSpace.Compactness.Uniform
            scope: subtree
          - name: reduced-negative-one
            package: singular_cohomology
            module: singular_cohomology.Chains.Reduced.NegativeOne
            scope: declarations
          - name: relative-long-exact
            package: singular_cohomology
            module: singular_cohomology.Relative.LongExact
            scope: declarations
          - name: relative-homotopy
            package: singular_cohomology
            module: singular_cohomology.Relative.Maps.Over.Homotopy.On
            scope: subtree
          - name: contractible-cohomology
            package: singular_cohomology
            module: singular_cohomology.Calculations.With.Contractible
            scope: subtree
          - name: path-components-homology
            package: singular_cohomology
            module: singular_cohomology.Zero.Homology
            scope: subtree
          - name: path-components-cohomology
            package: singular_cohomology
            module: singular_cohomology.Zero.With.Functions
            scope: declarations
          - name: small-cochain-comparison
            package: singular_cohomology
            module: singular_cohomology.OpenCover.On.With
            scope: subtree
          - name: mayer-vietoris-homology
            package: singular_excision
            module: singular_excision.MayerVietoris.Over.On.Chains.Homology.At
            scope: declarations
          - name: mayer-vietoris-cohomology
            package: singular_excision
            module: singular_excision.MayerVietoris.Over.On.Chains.Cohomology.At
            scope: declarations
    env:
      REF_TYPE_CACHE: ${{ github.workspace }}/.ci/refcache
      REF_TYPE_PROFILE_STORAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checker
          path: build
      - uses: actions/cache/restore@v4
        id: scope-proof-cache
        with:
          path: ${{ github.workspace }}/.ci/refcache
          key: proof-scope-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-${{ matrix.name }}-${{ hashFiles('libs/**/*.ref', 'libs/**/ref.toml') }}
          restore-keys: |
            proof-scope-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-${{ matrix.name }}-
            proof-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-
      - name: Prepare memory for large comparisons
        run: |
          sudo fallocate -l 32G /mnt/ref-type-check.swap
          sudo chmod 600 /mnt/ref-type-check.swap
          sudo mkswap /mnt/ref-type-check.swap
          sudo swapon /mnt/ref-type-check.swap
          free -h
      - name: Check ${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          chmod +x build/ref-type
          args=("libs/topology/${{ matrix.package }}" --module "${{ matrix.module }}"
            --memory-mib 40960 --batch-seconds 1800
            --cache-dir "$REF_TYPE_CACHE" --cache-budget-mib 4096 --diagnostics compact)
          if [[ "${{ matrix.scope }}" == declarations ]]; then
            args+=(--module-only)
          fi
          /usr/bin/time -v build/ref-type "${args[@]}" 2>&1 | tee check.log
      - uses: actions/cache/save@v4
        if: always() && steps.scope-proof-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ci/refcache
          key: ${{ steps.scope-proof-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.name }}
          path: check.log
          retention-days: 1
