name: Singular cohomology
on:
  push:
    branches: [feat/singular-cohomology]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: singular-cohomology-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.ci/rustup
      CARGO_BUILD_JOBS: 3
      REF_TYPE_CACHE: ${{ github.workspace }}/.ci/refcache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci/cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Identify Rust toolchain
        id: rust-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: checker-cache
        with:
          path: build/ref-type
          key: checker-${{ runner.os }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs', 'src/**/Cargo.toml') }}
      - name: Build checker
        if: steps.checker-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --locked -p cli
          mkdir -p build
          cp target/debug/cli build/ref-type
          strip --strip-debug build/ref-type
      - uses: actions/cache/restore@v4
        id: proof-cache
        with:
          path: ${{ github.workspace }}/.ci/refcache
          key: proof-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-${{ hashFiles('libs/**/*.ref', 'libs/**/ref.toml') }}
          restore-keys: proof-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-
      - name: Check the singular chain complex
        run: >-
          build/ref-type libs/topology/singular_cohomology
          --module singular_cohomology.Chains --module-only
          --memory-mib 8192 --batch-seconds 900
          --cache-dir "$REF_TYPE_CACHE" --cache-budget-mib 2048
          --diagnostics compact
      - uses: actions/cache/save@v4
        if: steps.proof-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ci/refcache
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: checker
          path: build/ref-type
          retention-days: 1
  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - name: torus-cup-generator
            package: cohomology_examples
            module: cohomology_examples.Torus.Geometry.Ring.Primitive
            scope: subtree
          - name: projective-plane-groups
            package: cohomology_examples
            module: cohomology_examples.ProjectivePlane.Geometry.Cohomology
            scope: subtree
          - name: projective-plane-finite-comparison
            package: cohomology_examples
            module: cohomology_examples.ProjectivePlane.Cellular.Comparison
            scope: subtree
          - name: integer-singular-pairing
            package: singular_tensor_dual
            module: singular_tensor_dual.Integer.Singular
            scope: declarations
          - name: tensor-homotopy
            package: singular_eilenberg_zilber
            module: singular_eilenberg_zilber.TensorHomotopy
            scope: declarations
          - name: sphere-reflection-homology
            package: sphere_maps
            module: sphere_maps.Hemispheres.Homology.Whole
            scope: subtree
          - name: integer-units
            package: singular_finite_algebra
            module: singular_finite_algebra.Integer.Units
            scope: subtree
          - name: attachment-exactness
            package: singular_finite_algebra
            module: singular_finite_algebra.Integer.Attachment
            scope: subtree
          - name: simplicial-chain-map
            package: singular_simplicial
            module: singular_simplicial.Complex.On.Chains
            scope: declarations
          - name: involution-separation
            package: cohomology_examples
            module: cohomology_examples.Involution.Separation
            scope: subtree
          - name: closed-fillings
            package: singular_eilenberg_zilber
            module: singular_eilenberg_zilber.TensorModels.Ladder.Fillings
            scope: declarations
          - name: projective-cone
            package: singular_finite_algebra
            module: singular_finite_algebra.Integer.ProjectiveCone.On
            scope: declarations
          - name: connecting-lift
            package: ../algebra/homological/chain_complexes
            module: chain_complexes.Cochain.Over.ShortExact.With.At
            scope: declarations
          - name: cohomology-coordinates
            package: singular_finite_algebra
            module: singular_finite_algebra.Integer.HomZero
            scope: subtree
          - name: hom-coordinate-transport
            package: singular_finite_algebra
            module: singular_finite_algebra.Integer.HomTransport
            scope: subtree
          - name: native-equivalences
            package: ../algebra/homological/double_complexes
            module: double_complexes.NonnegativeChain.Over.Equivalence
            scope: subtree
          - name: finite-circle
            package: cohomology_examples
            module: cohomology_examples.Circle
            scope: declarations
          - name: primitive-circle-loop
            package: cohomology_examples
            module: cohomology_examples.Circle.Geometry.Loop.Primitive
            scope: subtree
          - name: tensor-dual-integer
            package: singular_tensor_dual
            module: singular_tensor_dual.Integer
            scope: subtree
          - name: graph-indexing
            package: cohomology_examples
            module: cohomology_examples.Graph.On.Geometry.Indexing
            scope: subtree
          - name: projective-attachment
            package: cohomology_examples
            module: cohomology_examples.ProjectivePlane.Geometry.Attachment.Comparison.Pair
            scope: subtree
          - name: skeletal-ambient
            package: singular_cellular
            module: singular_cellular.On.Skeletal.Ambient
            scope: subtree
          - name: surface-coordinates
            package: cohomology_examples
            module: cohomology_examples.Surface.On.Simplicial.Coefficients.Cohomology
            scope: subtree
          - name: mod-two-sequence
            package: cohomology_examples
            module: cohomology_examples.Two.Quotient.Sequence
            scope: subtree
          - name: torus-terms
            package: cohomology_examples
            module: cohomology_examples.Torus.Geometry.Comparison.Terms
            scope: subtree
          - name: cech-algebra
            package: singular_cech
            module: singular_cech
            scope: subtree
          - name: simplicial-comparison
            package: singular_simplicial
            module: singular_simplicial
            scope: subtree
          - name: cup-symmetry
            package: singular_symmetry
            module: singular_symmetry
            scope: subtree
          - name: tensor-dual
            package: singular_tensor_dual
            module: singular_tensor_dual
            scope: subtree
          - name: circle-comparison
            package: cohomology_examples
            module: cohomology_examples.Circle.Geometry
            scope: subtree
          - name: circle-powers
            package: sphere_maps
            module: sphere_maps.Circle.Powers.Degree
            scope: subtree
          - name: sphere-maps
            package: sphere_maps
            module: sphere_maps
            scope: subtree
          - name: cellular-algebra
            package: singular_cellular_algebra
            module: singular_cellular_algebra
            scope: subtree
          - name: finite-algebra
            package: singular_finite_algebra
            module: singular_finite_algebra
            scope: subtree
          - name: low-degree-products
            package: singular_low_degree
            module: singular_low_degree
            scope: subtree
          - name: cellular-comparison
            package: singular_cellular
            module: singular_cellular
            scope: subtree
          - name: computed-examples
            package: cohomology_examples
            module: cohomology_examples
            scope: subtree
          - name: eilenberg-zilber
            package: singular_eilenberg_zilber
            module: singular_eilenberg_zilber
            scope: subtree
          - name: good-pair-cohomology
            package: singular_excision
            module: singular_excision.GoodPair.On.With.At
            scope: declarations
          - name: good-pair-homology
            package: singular_excision
            module: singular_excision.GoodPair.On.Homology
            scope: declarations
          - name: zero-sphere-reduced-cohomology
            package: cohomology_models
            module: cohomology_models.ZeroSphere.Reduced.With
            scope: subtree
          - name: zero-sphere-reduced-homology
            package: cohomology_models
            module: cohomology_models.ZeroSphere.Reduced.Homology
            scope: subtree
          - name: sphere-cover-cohomology
            package: cohomology_models
            module: cohomology_models.SphereCover.With
            scope: subtree
          - name: sphere-cover-homology
            package: cohomology_models
            module: cohomology_models.SphereCover.Homology
            scope: declarations
          - name: spheres-cohomology
            package: cohomology_models
            module: cohomology_models.Spheres.With
            scope: subtree
          - name: spheres-homology
            package: cohomology_models
            module: cohomology_models.Spheres.Homology
            scope: subtree
          - name: sphere-degree
            package: cohomology_models
            module: cohomology_models.Spheres.Orientation
            scope: subtree
          - name: ordered-shuffle
            package: singular_products
            module: singular_products.OrderedShuffle
            scope: subtree
          - name: product-evaluation
            package: singular_products
            module: singular_products.ProductChains
            scope: subtree
          - name: cech-kernel
            package: singular_cech
            module: singular_cech.Algebra.ProjectiveQuasi.Kernel.Resolution
            scope: declarations
          - name: cech-comparison
            package: singular_cech
            module: singular_cech.Algebra.ProjectiveQuasi.Contracted.Equivalence
            scope: declarations
    env:
      REF_TYPE_CACHE: ${{ github.workspace }}/.ci/refcache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: checker
          path: build
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci/refcache
          key: proof-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-${{ hashFiles('libs/**/*.ref', 'libs/**/ref.toml') }}-${{ matrix.name }}
          restore-keys: proof-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}-
      - name: Prepare memory for large comparisons
        run: |
          sudo fallocate -l 16G /mnt/ref-type-check.swap
          sudo chmod 600 /mnt/ref-type-check.swap
          sudo mkswap /mnt/ref-type-check.swap
          sudo swapon /mnt/ref-type-check.swap
          free -h
      - name: Check ${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          chmod +x build/ref-type
          args=("libs/topology/${{ matrix.package }}" --module "${{ matrix.module }}"
            --memory-mib 24576 --batch-seconds 1800
            --cache-dir "$REF_TYPE_CACHE" --cache-budget-mib 4096 --diagnostics compact)
          if [[ "${{ matrix.scope }}" == declarations ]]; then
            args+=(--module-only)
          fi
          /usr/bin/time -v build/ref-type "${args[@]}" 2>&1 | tee check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.name }}
          path: check.log
          retention-days: 1
