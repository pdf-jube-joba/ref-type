<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ref Type playground</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div><h1>Ref Type <span>playground</span></h1><p>コードを書いて、型と評価結果を確認できます。</p></div>
    <div class="controls">
      <label><input id="automatic" type="checkbox" checked> 自動チェック</label>
      <button id="run" type="button">実行 <kbd>Ctrl ↵</kbd></button>
    </div>
  </header>
  <main>
    <section class="pane source-pane" aria-labelledby="source-title">
      <div class="pane-heading"><h2 id="source-title">コード</h2><span>root.ref</span></div>
      <div class="editor">
        <pre id="lines" aria-hidden="true">1</pre>
        <textarea id="source" aria-label="Ref Type コード" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
      </div>
      <footer><span id="position">行 1 · 列 1</span><span>Tab: 2 スペース · ブラウザに自動保存</span></footer>
    </section>
    <section class="pane result-pane" aria-labelledby="result-title">
      <div class="pane-heading"><h2 id="result-title">結果</h2><span id="status" role="status" aria-live="polite">待機中</span></div>
      <div class="results">
        <h3>エラー <span id="error-count">0</span></h3>
        <pre id="diagnostics" class="empty">エラーはありません。</pre>
        <h3>出力</h3>
        <pre id="outputs" class="empty">実行結果がここに表示されます。</pre>
      </div>
      <footer><span>\infer · \check · \eval · \normalize</span><span id="elapsed"></span></footer>
    </section>
  </main>
</body>
</html>
