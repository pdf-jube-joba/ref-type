[dependencies]
axum = "0.8"
clap = { version = "4.5.51", features = ["derive"] }
sema = { path = "../../src/sema" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
